name: Build and Push Docker Image

# Rust backend image (Dockerfile.rust: UI static export + cargo test with
# the golden byte-parity suite + slim alpine runtime). Published under the
# main tag 0x3654/untilwall:latest - the deployment flow (Semaphore ->
# ansible role) is unchanged. Rollback is manual: pull a previous :sha tag,
# :stable, or the es backup archive.

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'src/**'
      - 'tests/golden/**'
      - 'scripts/golden/**'
      - 'Dockerfile.rust'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # Ручной запуск

env:
  DOCKER_IMAGE: 0x3654/untilwall
  DOCKER_TAG: ${{ github.sha }}
  APP_URL: https://untilwall.0x3654.com

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up QEMU (for arm64)
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image (cargo test with golden parity runs inside)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rust
          platforms: ${{ matrix.platform }}
          load: true  # load locally for the smoke test below
          tags: ${{ env.DOCKER_IMAGE }}:test-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          build-args: |
            APP_URL=${{ env.APP_URL }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Smoke test container (amd64)
        if: matrix.platform == 'linux/amd64'
        run: |
          echo "=== Testing amd64 container ==="
          docker run -d --name untilwall-test -p 3000:3000 \
            -e NODE_ENV=production \
            -e TZ=Europe/Moscow \
            -e RENDER_DENSITY=72 \
            -e RENDER_CONCURRENCY=1 \
            ${{ env.DOCKER_IMAGE }}:test-amd64

          # Wait for healthcheck
          for i in {1..30}; do
            if docker ps | grep -q "untilwall-test.*healthy"; then
              echo "Container is healthy"
              break
            fi
            sleep 2
          done

          # Show logs
          echo "=== Container logs ==="
          docker logs untilwall-test

          # Test endpoints
          curl -f http://localhost:3000/api/health || exit 1
          echo "Health endpoint OK"
          curl -s http://localhost:3000/api/health | grep -q '"defaultTzOffset":3' || exit 1
          echo "TZ default (Europe/Moscow) OK"

          curl -f "http://localhost:3000/goal?start_date=2000-01-01&end_date=2024-01-01&width=1170&height=2532&format=svg" || exit 1
          echo "Goal SVG endpoint OK"

          # PNG path: strip renderer + tz param, native resolution at density 72
          curl -f "http://localhost:3000/goal?start_date=2000-01-01&end_date=2024-01-01&width=1170&height=2532&tz=%2B3" -o /tmp/w.png || exit 1
          file /tmp/w.png | grep -q "PNG image data, 1170 x 2532" || exit 1
          echo "PNG (density 72, tz=+3) OK"

          # Exported UI assets are served
          curl -f -o /dev/null http://localhost:3000/ || exit 1
          echo "Homepage OK"

          docker stop untilwall-test
          docker rm untilwall-test

      - name: Tag and push per-arch (only if tests passed)
        if: success()
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:test-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }} \
            ${{ env.DOCKER_IMAGE }}:latest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          docker tag ${{ env.DOCKER_IMAGE }}:test-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }} \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

          docker push ${{ env.DOCKER_IMAGE }}:latest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "Tests failed, not pushing to Docker Hub"
          docker stop untilwall-test || true
          docker rm untilwall-test || true

  merge-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifest
        run: |
          # Create manifest for latest
          docker buildx imagetools create \
            --tag ${{ env.DOCKER_IMAGE }}:latest \
            ${{ env.DOCKER_IMAGE }}:latest-amd64 \
            ${{ env.DOCKER_IMAGE }}:latest-arm64

          # Create manifest for SHA tag
          docker buildx imagetools create \
            --tag ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}-amd64 \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}-arm64

          echo "Multi-arch manifests created"
          echo "Available tags:"
          echo "  - ${{ env.DOCKER_IMAGE }}:latest (amd64 + arm64)"
          echo "  - ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} (amd64 + arm64)"

      - name: Trigger Semaphore deploy-untilwall
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.SEMAPHORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            ${{ secrets.SEMAPHORE_URL }}/api/project/1/tasks \
            -d "{\"template_id\": ${{ secrets.SEMAPHORE_TEMPLATE_ID }}}"
          echo "Semaphore deploy-untilwall triggered"
