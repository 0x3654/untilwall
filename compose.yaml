services:
  untilwall:
    container_name: untilwall
    image: docker.io/0x3654/untilwall:latest
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Europe/Moscow
      - RENDER_DENSITY=72
      - RENDER_CONCURRENCY=1
    volumes:
      - ./.data:/app/data
    restart: always
